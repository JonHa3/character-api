spring.application.name=character.api
# Set SPRING_DATASOURCE_URL as an environment variable locally and on Render.
# Spring Boot reads it automatically, so nothing secret lives in this file.

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Uncomment to see the SQL Hibernate runs
#logging.level.org.hibernate.SQL=DEBUG

server.port=${PORT:8080}
